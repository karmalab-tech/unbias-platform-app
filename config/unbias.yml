# Product limits. Adjust here; the frontend reads them from /api/public/settings.
shared:
  max_photos_per_submission: 20
  max_people_per_photo: 4
  min_short_side_px: 768
  max_file_bytes: 20971520
  accepted_content_types:
    - image/jpeg
    - image/png
    - image/webp
  draft_ttl_hours: 24
  rejected_media_retention_days: 30
  stats_poll_seconds: 5
  detection_min_score: 0.35
  blur_variance_threshold: 40
  phash_max_distance: 8
  vlm_model: claude-sonnet-5
  vlm_max_side_px: 1024
  detection_min_area_ratio: 0.05
  installation_poll_seconds: 3
  consent_version: v0-draft
  people_milestone: 10000
  max_active_calls_to_action: 3
  launch_boost_photos_floor: 1573
  launch_boost_people_floor: 1100
  launch_boost_until: 2500
  launch_boost_step: 10

test:
  launch_boost_photos_floor: 0
  launch_boost_people_floor: 0
