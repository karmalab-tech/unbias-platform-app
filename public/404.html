<!doctype html>
<html lang="en">
  <head>
    <title>The page you were looking for doesn’t exist (404 Not found)</title>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="/favicon-32.png" type="image/png">
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      * { margin: 0; }
      body {
        background: #fff8e8;
        color: #29211f;
        font-family: "Archivo Variable", Archivo, "Helvetica Neue", Helvetica, Arial, sans-serif;
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr;
        -webkit-font-smoothing: antialiased;
      }
      header {
        background: #29211f;
        color: #fff8e8;
        border-bottom: 2px solid #29211f;
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 76px;
        padding: 12px 24px;
      }
      header img { width: 52px; height: 52px; }
      header span {
        font-size: 30px;
        font-weight: 900;
        font-stretch: 75%;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      main { display: grid; place-items: center; padding: 24px; }
      article {
        background: #fff8e8;
        border: 2px solid #29211f;
        box-shadow: 6px 6px 0 #fb4748;
        max-width: 560px;
        padding: 32px;
      }
      h1 {
        font-size: clamp(36px, 7vw, 56px);
        font-weight: 900;
        font-stretch: 75%;
        line-height: 0.95;
        text-transform: uppercase;
      }
      p { font-size: 18px; line-height: 1.5; margin-top: 16px; color: rgba(41, 33, 31, 0.72); }
      a {
        display: inline-block;
        margin-top: 24px;
        background: #fb4748;
        border: 2px solid #29211f;
        color: #29211f;
        font-family: "JetBrains Mono Variable", "JetBrains Mono", ui-monospace, monospace;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.1em;
        padding: 16px 22px;
        text-decoration: none;
        text-transform: uppercase;
      }
      a:hover { background: #dfe75c; }
    </style>
  </head>
  <body>
    <!-- This file lives in public/404.html -->
    <header>
      <img src="/icon.png" alt="">
      <span>Unbias</span>
    </header>
    <main>
      <article>
        <h1>Page not found</h1>
        <p>The page you were looking for doesn’t exist. You may have mistyped the address or the page may have moved.</p>
        <a href="/">Back to home</a>
      </article>
    </main>
  </body>
</html>
